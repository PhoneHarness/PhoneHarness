# Human-curated verifiers for 4app_new (14 tasks).
# Based on AndroidWorld philosophy: check final device state, before/after comparison,
# fuzzy match, all rule-based, zero LLM.
# Includes MobileAgent OSWorld-MCP TIR-inspired tool_not_called checks.
#
# DO NOT regenerate with generate_hybrid_bench_base_verifiers.py — this file is manually maintained.

version: 2
source_workbook: benchmark/Hybrid-Bench.xlsx
source_sheet: 4app_new
id_policy:
  task_uid_format: <sheet>:<task_id>
  collision_suffix: ':r<source_row> (only when a sheet reuses the same task_id)'
  note: task_id is not globally unique across sheets; always key by task_uid
scoring:
  mode: binary
  pass: 1
  fail: 0
task_pass_rule: base_verifier_pass
verifier_types:
  composite: Multi-check verifier; ALL checks must pass. Combines state checks, trace analysis, and TIR.
  system_setting: Check that a system-level state reached the requested target.
  tool_called: Check that a key tool/action was successfully invoked.
  tool_not_called: TIR check — verify forbidden/distractor tools were NOT invoked.
  email_sent: Check that an email side effect happened with recipient and content constraints.
  answer_contains: Check that the final answer contains required signals.
  answer_matches: Check that the final answer matches regex patterns.
  gui_app_opened: Check that a specific mock app was opened during the task.
  artifact_exists: Check that an output artifact exists with plausible extension and size.
  artifact_content_contains: Check artifact exists AND text content contains required keywords.
  calendar_event_created: Check that a calendar event was created with expected hints.
  alarm_set: Check that an alarm is set on the device.
summary:
  sheet: 4app_new
  task_count: 26
  kept_count: 14
  verifier_type_counts:
    composite: 11
    system_setting: 2
    answer_contains: 1

