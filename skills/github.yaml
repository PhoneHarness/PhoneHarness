name: github
description: GitHub 仓库/Issue/PR 搜索与操作
prompt_extension: |
  ## GitHub

  搜索仓库：
  ```
  curl -s 'https://api.github.com/search/repositories?q=关键词&sort=stars&per_page=10'
  ```
  Response: JSON with `items[]`, each has `full_name`, `description`, `stargazers_count`, `html_url`.

  搜索 Issue：
  ```
  curl -s 'https://api.github.com/search/issues?q=关键词&sort=updated&per_page=10'
  ```

  If API fails, stop and report the error. Do NOT fabricate data.
